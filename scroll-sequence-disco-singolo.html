<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-Linked Image Sequence — Single Disc</title>

<style>
  :root{
    --bg-dark:#0B0B0C;
    --bg-plate:#1c1c1d;
    --accent:#FFD100;
    --text-light:#f5f5f5;
    --text-muted:rgba(245,245,245,.6);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    background:var(--bg-dark);
    color:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  /* ============================================================
     DEMO-ONLY SPACERS — delete these two .demo-spacer sections
     when you drop the real .sequence-section into your page.
     They just give the pin something to scroll through when
     you preview this file on its own.
     ============================================================ */
  .demo-spacer{
    min-height:60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    font-size:clamp(1.1rem,3vw,1.6rem);
    color:rgba(255,255,255,.5);
  }

  /* ============================================================
     THE ACTUAL COMPONENT — everything below this line (plus the
     matching <section class="sequence-section"> markup and the
     script at the bottom) is what you drop into your site.
     ============================================================ */

  .sequence-section{
    position:relative;
    height:100vh;
    height:100dvh;
  }
  .sequence-pin{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--bg-plate);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sequence-pin canvas{
    display:block;
    width:100%;
    height:100%;
  }

  /* Loading fallback: shown until every frame has finished loading */
  .sequence-loader{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:var(--bg-plate);
    transition:opacity .5s ease, visibility .5s ease;
  }
  .sequence-loader.is-hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .loader-bar{
    width:min(240px,60vw);
    height:3px;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    overflow:hidden;
  }
  .loader-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:999px;
    transition:width .15s ease-out;
  }
  .loader-text{
    margin:0;
    font-size:.8rem;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  /* Optional caption overlay — purely decorative, safe to remove */
  .sequence-caption{
    position:absolute;
    left:0; right:0; bottom:32px;
    z-index:1;
    text-align:center;
    pointer-events:none;
  }
  .sequence-caption p{
    margin:0;
    font-size:.75rem;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.4);
  }

  @media (max-width:600px){
    .loader-text{ font-size:.72rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .sequence-loader{ transition:none; }
  }
</style>
</head>
<body>

<div class="demo-spacer">↓ scroll down — the sequence section pins here ↓</div>

<!-- ============== DROP-IN COMPONENT START ============== -->
<section class="sequence-section" id="sequenceSection">
  <div class="sequence-pin">
    <canvas id="sequenceCanvas" aria-hidden="true"></canvas>

    <div class="sequence-caption" aria-hidden="true">
      <p>Scroll to play</p>
    </div>

    <div class="sequence-loader" id="sequenceLoader">
      <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
      <p class="loader-text" id="loaderText">Loading 0%</p>
    </div>
  </div>
</section>
<!-- ============== DROP-IN COMPONENT END ============== -->

<div class="demo-spacer">↑ the section releases and normal scrolling resumes ↑</div>

<!-- GSAP + ScrollTrigger (pin, correctly, is what actually does the scroll-scrubbing) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
(function(){
  "use strict";

  /* ---- configure this to match your frames ---- */
  var FRAME_COUNT = 300;
  var FRAME_FOLDER = 'discosingolo_webp/';
  var FRAME_NAME = function(i){
    return FRAME_FOLDER + 'ezgif-frame-' + String(i + 1).padStart(3, '0') + '.webp';
  };
  /* ---------------------------------------------- */

  var section = document.getElementById('sequenceSection');
  var canvas = document.getElementById('sequenceCanvas');
  var ctx = canvas.getContext('2d');
  var loader = document.getElementById('sequenceLoader');
  var loaderFill = document.getElementById('loaderFill');
  var loaderText = document.getElementById('loaderText');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var images = new Array(FRAME_COUNT);
  var loadedCount = 0;
  var seq = { frame: 0 };
  var dpr = 1;

  function sizeCanvas(){
    var rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    // resizing the canvas resets its context, so smoothing has to be
    // re-applied every time — this is what actually kills the pixelation
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  // HiDPI-aware "cover" draw, always centered — this is what keeps the
  // frame sharp and centered on small/mobile screens too.
  function render(){
    var img = images[Math.round(seq.frame)];
    if (!img || !img.complete || !img.naturalWidth) return;
    var cw = canvas.width, ch = canvas.height;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var scale = Math.max(cw / iw, ch / ih);
    var dw = iw * scale, dh = ih * scale;
    var dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function updateLoaderUI(){
    var pct = Math.round((loadedCount / FRAME_COUNT) * 100);
    if (loaderFill) loaderFill.style.width = pct + '%';
    if (loaderText) loaderText.textContent = 'Loading ' + pct + '%';
  }

  // ---- Preload every frame first, THEN wire up scroll ----
  function preload(){
    for (var i = 0; i < FRAME_COUNT; i++){
      (function(idx){
        var img = new Image();
        img.decoding = 'async';
        img.onload = img.onerror = function(){
          loadedCount++;
          updateLoaderUI();
          // paint the very first frame as soon as it lands, so the
          // canvas is never a blank rectangle while the rest load
          if (idx === 0){ sizeCanvas(); render(); }
          if (loadedCount === FRAME_COUNT) onAllLoaded();
        };
        img.src = FRAME_NAME(idx);
        images[idx] = img;
      })(i);
    }
  }

  function onAllLoaded(){
    if (loader) loader.classList.add('is-hidden');
    sizeCanvas();
    render();
    initScrub();
  }

  // ---- Map scroll to frame index via GSAP ScrollTrigger ----
  function initScrub(){
    if (!(window.gsap && window.ScrollTrigger)){
      // GSAP failed to load (CDN blocked, offline, etc.) — degrade to a
      // plain scroll-linked fallback instead of leaving the section dead.
      initFallback();
      return;
    }

    gsap.registerPlugin(ScrollTrigger);

    gsap.to(seq, {
      frame: FRAME_COUNT - 1,
      snap: 'frame',
      ease: 'none',
      scrollTrigger: {
        trigger: section,
        start: 'top top',
        end: '+=300%',
        scrub: reduceMotion ? true : 0.45, // small eased scrub = no stutter
        pin: true,
        anticipatePin: 1,
        invalidateOnRefresh: true
      },
      onUpdate: render
    });

    ScrollTrigger.addEventListener('refreshInit', sizeCanvas);

    // Web fonts / late-loading content above this section can reflow the
    // page after ScrollTrigger first measured it — recalc once settled.
    if (document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){ ScrollTrigger.refresh(); });
    }
  }

  // Minimal no-GSAP fallback: CSS sticky pin + a plain scroll listener.
  function initFallback(){
    document.documentElement.classList.add('no-gsap');
    section.style.height = '400vh';

    var ticking = false;
    function onScroll(){
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function(){
        ticking = false;
        var rect = section.getBoundingClientRect();
        var total = rect.height - window.innerHeight;
        if (total <= 0) return;
        var progress = Math.min(1, Math.max(0, -rect.top / total));
        seq.frame = Math.round(progress * (FRAME_COUNT - 1));
        render();
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  window.addEventListener('resize', function(){
    sizeCanvas();
    render();
    if (window.ScrollTrigger) ScrollTrigger.refresh();
  });

  sizeCanvas();
  preload();
})();
</script>

<style>
  /* Sticky pin used only by the no-GSAP fallback path above */
  .no-gsap .sequence-pin{
    position:sticky;
    top:0;
  }
</style>

</body>
</html>
